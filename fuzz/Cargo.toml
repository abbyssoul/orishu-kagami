[package]
name = "orishu-formation-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Isolated like avahi-tui/fuzz: libFuzzer never enters the product build graph.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
serde = "1"
serde_json = "1"
# CBOR decode for the resource discriminator target; pinned to the workspace version.
ciborium = "=0.2.2"
orishu-membership = { path = "../crates/orishu-membership" }
orishu-worker = { path = "../apps/orishu-worker" }
orishu = { path = "../crates/orishu" }
orishu-identity = { path = "../crates/orishu-identity" }
orishu-resource = { path = "../crates/orishu-resource" }
orishu-variables = { path = "../crates/orishu-variables" }
orishu-workload = { path = "../crates/orishu-workload" }
orishu-plugin = { path = "../crates/orishu-plugin" }
kagami-catalog = { path = "../crates/kagami-catalog" }
kagami-document = { path = "../crates/kagami-document" }
kagami-session = { path = "../crates/kagami-session" }

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "membership_messages"
path = "fuzz_targets/membership_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "worker_frames"
path = "fuzz_targets/worker_frames.rs"
test = false
doc = false
bench = false

