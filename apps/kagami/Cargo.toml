[package]
name = "kagami"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native authoring and visualization client for Orishu"

[lib]
name = "kagami"
path = "src/lib.rs"

[[bin]]
name = "kagami"
path = "src/main.rs"

[dependencies]
iced = { workspace = true, features = ["wgpu", "debug", "tokio"] }
clap.workspace = true
rfd.workspace = true
kagami-renderer.workspace = true
kagami-catalog.workspace = true
kagami-document.workspace = true
kagami-session.workspace = true
orishu.workspace = true
env_logger = "0.11"
log = "0.4"
