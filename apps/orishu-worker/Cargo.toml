[package]
name = "orishu-worker"
version = "0.1.0"
edition = "2024"
authors = ["Ivan Ryabov <abbyssoul@gmail.com>"]
description = "Distributed simulation worker daemon for the orishu runtime"
homepage = "https://github.com/abbyssoul/orishu-kagami"
repository = "https://github.com/abbyssoul/orishu-kagami"
readme = "README.md"
license = "Apache-2.0"

[package.metadata.deb]
maintainer = "Ivan Ryabov <abbyssoul@gmail.com>"
copyright = "2026, Ivan Ryabov <abbyssoul@gmail.com>"
license-file = ["../../LICENSE", "4"]
maintainer-scripts = "debian"
section = "net"
priority = "optional"
extended-description = """\
Distributed simulation worker daemon for the orishu runtime.
Installs the worker binary, packaged systemd unit, and a local-socket-first default configuration."""
assets = [
    "$auto",
    [
        "../../etc/orishu-worker.conf",
        "etc/orishu/orishu-worker.conf",
        "644",
    ],
    [
        "../../etc/systemd/orishu-worker.service.d/tls-credentials.conf.example",
        "usr/share/doc/orishu-worker/examples/tls-credentials.conf.example",
        "644",
    ],
]

[package.metadata.deb.systemd-units]
unit-scripts = "../../etc/systemd"
enable = true
start = true

[features]
# Optional local diagnostics; reuses the existing bounded HTTP stack.
observability = []
# Optional bounded local client-operation OTLP export; disabled at runtime by default.
otlp-tracing = ["dep:opentelemetry-proto", "dep:prost", "dep:reqwest"]
# Explicit development-only fault injection. Never included in operator builds.
formation-fault-test = []

[dependencies]
# Maintained OTLP messages only: no gRPC transport, ambient SDK exporter or logs.
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "trace"], optional = true }
prost = { version = "=0.14.3", optional = true }
# Explicit collector-only HTTP client; TLS configuration is supplied by the worker.
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider"], optional = true }
ciborium = "=0.2.2"
thiserror = { workspace = true }
orishu-membership = { workspace = true }
# Reuse the workspace's existing Quinn/rustls versions and crypto provider.
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "aws_lc_rs"] }
# Self-sufficient peer certificate bootstrap; no openssl executable is required.
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
sha2 = { workspace = true }
# Device-constrained sockets (SO_BINDTODEVICE) for explicit network placement.
# Already resolved in the tree through quinn-udp and tokio; this only names it.
socket2 = "=0.6.5"
serde_json = { workspace = true }
subtle = "=2.6.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
orishu = { workspace = true }
pretty_assertions = "1.4.1"
salvo = { version = "0.96", default-features = false, features = [
    "aws-lc-rs",
    "http1",
    "http2",
    "rustls",
    "server",
    "server-handle",
    "unix",
] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.50.0", features = ["macros", "signal"] }

[target.'cfg(unix)'.dependencies]
# Descriptor-relative credential access, advisory instance lock and interface
# index lookup, without unsafe code.
rustix = { version = "=1.1.4", features = ["fs", "net", "process"] }

[dev-dependencies]
criterion = { workspace = true }
dhat = { workspace = true }
tempfile = "=3.27.0"
# Bounded subprocess checks for hostile environment variables, without global mutation.
tokio = { version = "1.50.0", features = ["process"] }
# Real collector TLS fixtures, using the already resolved worker TLS adapter.
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["aws_lc_rs"] }

[[example]]
name = "formation-telemetry-probe"
required-features = ["observability", "otlp-tracing"]

[[bench]]
name = "formation"
harness = false
