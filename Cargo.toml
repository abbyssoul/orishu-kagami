[workspace]
resolver = "3"
members = [
    "apps/*",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/abbyssoul/orishu-kagami"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.8.2"
dhat = "0.3.3"
glam = { version = "0.33", features = ["bytemuck"] }
iced = "0.14.0"
kagami-renderer = { path = "crates/kagami-renderer" }
orishu = { path = "crates/orishu" }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

