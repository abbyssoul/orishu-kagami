# orishu worker configuration example
# See docs/orishu-configuration.md for the configuration model
#
# Current runtime support is limited to:
# - name, cluster.name and spec.stateDir
# - spec.listen.clients
# - spec.listen.peers and spec.advertise.peers (one literal socket address each)
# - spec.interface.peers and spec.interface.clients (one interface per role)
# - spec.accepts.peers (default false; true requires a peer listener)
# - spec.tls.cert
# - spec.tls.key
# - spec.logging (optional bounded structured stdout logging)
#
# Other fields below document the intended future shape of the worker config,
# but are not yet consumed by the binary.

name: "worker-01"

cluster:
  name: "research-cluster-a"

spec:
  # Independent from metrics and trace export. Operation records follow local
  # trace sampling; enabled lifecycle/failure events remain unsampled.
  logging:
    enabled: false
    queueRecords: 256
    shutdownMs: 250
  # Private stable worker certificate/operator credential storage. Formation
  # and node identities are fresh on every process start.
  stateDir: "/var/lib/orishu/worker"
  # Fine-grained control of this node's role in a cluster
  accepts:
    # User / client connection acceptance.
    # If a node is not allowed to accept direct connection from clients, it states still can be controlled via admin actions
    # relayed by other cluster peers.
    clients: true # set to false if this node should not accept direct client/admin connections.
    
    # Peer connection acceptance
    # Node still can join a cluster by initiating connection itself. Just won't be able to introduce other peers to the cluster.
    peers: false # Enable introduction explicitly; requires spec.listen.peers.

    # Does this node perform workload task computation 
    # or is this node just a relay for cluster messages?
    work: true # Set to false if this node should serve as a network message relay, and not compute the workload itself.

  listen:
    clients:
      # In a system-wide service this local socket is intentionally admin-only.
      # For non-root administration, add a TCP client listener and use auth/TLS.
      - "/run/orishu/worker.sock"

      # Uncomment and pair with spec.tls to expose a TCP client endpoint:
      # - "0.0.0.0:6680"
    # Explicit QUIC listener; disabled by default. Uses the persisted worker
    # identity, not spec.tls. Admission remains unavailable in this slice.
    peers: [] # Example: ["127.0.0.1:6655"]
    # Wildcard binds require spec.advertise.peers with a reachable IP:port.
    # Additional client listeners may be added later, for example:
    #   - "127.0.0.1:6680"

  # Bind each role's sockets to one named interface, so both ingress and egress
  # follow the selection instead of the host route table. Linux only. A placed
  # role must use a wildcard bind above; the device does the constraining and
  # spec.advertise.peers still publishes the reachable address. Unknown keys in
  # this block are rejected, but a misspelled *outer* key (spec.interfaces) is
  # silently ignored, so confirm the startup "placement ..." lines on stderr.
  interface:
    # peers: "eth0"    # every peer socket, including the initial join dial
    # clients: "eth0"  # TCP client listeners and their replies

  # (Optional) Limits on this node
  limits:
    # Maximum number of seeds this node can keep track of. 0 or null for no limit.
    seeds: 128
    # Maximum number of peers this node allows to connect. 0 or null for no limit.
    peers: 1024
    # Maximum number of clients that can connect to this node directly. 0 or null for no limit.
    clients: 0

  # Storage driver/backend configuration
  # For the purpose of persisting result of the computation and to enable checkpoints,
  # the node must have a storage backend configured.
  storage:
    replicas: 3
    backend: "local"
    local:
      path: "/var/lib/orishu/worker-01"

  # Encryption certificates and keys
  # Required, for any node to be able to accept network traffic.
  tls:
  #   ca: "/etc/orishu/pki/ca.crt"
  #   cert: "/etc/orishu/pki/worker-01.crt"
  #   key: "/etc/orishu/pki/worker-01.key"
