# Optional local-tracing warning examples, not measured SLOs or restart policy.
# Evaluate rate per metric before combining positive symptoms. Selecting several
# unlabelled metric names inside one rate() produces duplicate output labelsets.
groups:
  - name: orishu-worker-trace-v1
    interval: 1m
    rules:
      - alert: OrishuWorkerTraceLocalDrops
        expr: >-
          (
            (rate(orishu_worker_trace_active_full_total{job="orishu-worker"}[5m]) > 0)
            or (rate(orishu_worker_trace_queue_full_total{job="orishu-worker"}[5m]) > 0)
            or (rate(orishu_worker_trace_encoding_dropped_total{job="orishu-worker"}[5m]) > 0)
            or (rate(orishu_worker_trace_invalid_source_total{job="orishu-worker"}[5m]) > 0)
          ) and on (job, instance) (up{job="orishu-worker"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Worker recently shed sampled traces locally
      - alert: OrishuWorkerTraceDeliveryFailures
        expr: (rate(orishu_worker_trace_failed_total{job="orishu-worker"}[5m]) > 0) and on (job, instance) (up{job="orishu-worker"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Trace delivery attempts failed; collector acceptance may be unknown
      - alert: OrishuWorkerTraceCollectorRejections
        expr: (rate(orishu_worker_trace_rejected_total{job="orishu-worker"}[5m]) > 0) and on (job, instance) (up{job="orishu-worker"} == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Collector reported rejected worker spans
