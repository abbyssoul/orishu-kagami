# Standard-model particles used as reusable object templates.
#
# Physical data from NIST CODATA 2022 / SRD 121. Charge is authored in
# coulombs and mass in kilograms; the exclusion radius is a presentation and
# collision hint, not a measured extent.
---
apiVersion: kagami.catalog/v1
kind: ObjectTemplate
metadata:
  catalog: particles
  name: electron
  description: Electron
  annotations:
    source: NIST CODATA 2022 / SRD 121
spec:
  components:
  - type: {plugin: kagami.electromagnetic_sources, name: charge_source}
    properties:
      charge: {quantity: {expression: "-1.602176634e-19", unit: C}}
  - type: {plugin: kagami.mass_sources, name: inertial_mass}
    properties:
      mass: {quantity: {expression: "9.1093837139e-31", unit: kg}}
  - type: {plugin: kagami.mass_sources, name: gravitational_mass}
    properties:
      follows_inertial: {boolean: true}
  - type: {plugin: kagami.geometry, name: point}
    properties:
      exclusion_radius: {quantity: {expression: "2.82e-15", unit: m}}
---
