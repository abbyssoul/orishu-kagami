# Notable Solar System bodies, one object template per body.
#
# Physical data from NASA/JPL fact sheets and mission results; masses and
# radii are mean/equatorial values as flagged per entry. Every value is
# authored in an explicit unit and published in canonical SI.
---
apiVersion: kagami.catalog/v1
kind: ObjectTemplate
metadata:
  catalog: planets
  name: sol
  description: Sol
  annotations:
    source: NASA/JPL Planetary Fact Sheet
spec:
  components:
  - type: {plugin: kagami.mass_sources, name: inertial_mass}
    properties:
      mass: {quantity: {expression: "1.989e+30", unit: kg}}
  - type: {plugin: kagami.mass_sources, name: gravitational_mass}
    properties:
      follows_inertial: {boolean: true}
  - type: {plugin: kagami.geometry, name: sphere}
    properties:
      radius: {quantity: {expression: "6.9634e+8", unit: m}}
---
