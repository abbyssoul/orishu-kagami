global:
  scrape_interval: 5s
  scrape_timeout: 2s
scrape_configs:
  - job_name: orishu-worker-mtls
    scheme: https
    metrics_path: /metrics
    follow_redirects: false
    tls_config:
      ca_file: certs/server-ca.crt
      cert_file: certs/monitor.crt
      key_file: certs/monitor.key
      server_name: worker-mgmt.example
      min_version: TLS12
    static_configs:
      - targets: [worker-mgmt.example:9443]
