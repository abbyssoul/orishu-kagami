[package]
name = "orishu-plugin"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure simulation plugin declarations, bounded validation and canonical identity"

[dependencies]
# Installs `dhat`'s counting allocator for `examples/profile_plugin.rs`.
# Optional and never enabled by the library itself.
dhat = { workspace = true, optional = true }
orishu-resource.workspace = true
orishu-variables.workspace = true
orishu-workload.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
cargo_metadata = "0.23"
criterion = { workspace = true }
# Independent decoder for canonical fixtures; already resolved through criterion.
ciborium = "=0.2.2"

[features]
# Installs `dhat`'s counting allocator for `examples/profile_plugin.rs`.
# Never enabled by the library itself.
dhat = ["dep:dhat"]

[[bench]]
name = "plugin"
harness = false
