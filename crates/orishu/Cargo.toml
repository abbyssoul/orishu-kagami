[package]
name = "orishu"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared models and client interfaces for the Orishu simulation runtime"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2.2"
http = "1.5.0"
orishu-identity = { workspace = true }
orishu-resource = { workspace = true }
# Protocol run identities reuse canonical workload digests/CBOR, never a second codec.
orishu-workload = { workspace = true }
# Shared scientific observation validation; never depend on the execution engine.
orishu-plugin = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.13.5", features = ["stream"] }
reqwest-middleware = { version = "0.5.2", features = ["http2", "rustls"] }
reqwest-netrc = "0.1.3"
rust-netrc = "0.1.2"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["io-util", "fs"] }
futures-util = "0.3"
uom = { version = "0.38", features = ["autoconvert", "serde", "si"] }
serde-validate = "0.2"

[features]
# Define a simple feature named "my-rustls"
rustls = []
native-tls = []

# Optional: define a "default" feature set that is enabled automatically
default = ["rustls"]

# Shared imperative client IO; never added to pure scientific contracts.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
tokio = "1.53"
wiremock = "0.6"
pretty_assertions = "1.4"
