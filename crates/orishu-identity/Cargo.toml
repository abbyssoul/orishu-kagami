[package]
name = "orishu-identity"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared cluster-formation, node, and label identity types for the Orishu runtime"

# Deliberately dependency-poor: this crate is shared by the networking client in
# `orishu` and by the sans-IO `orishu-membership` core, which must not acquire a
# networking, async-runtime, clock, filesystem, TLS, or RNG dependency.
[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The tests pin the serialized wire contract against real bytes in both a
# human-readable and a binary codec, because the one place the two encodings
# differ — a fingerprint is hex text in JSON and a byte string in CBOR — is this
# crate's own `is_human_readable` logic. `cargo_metadata` lets the dependency
# budget be a test rather than a review note.
serde_json.workspace = true
ciborium = "0.2.2"
cargo_metadata = "0.23"
