[package]
name = "orishu-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared sandboxed scientific execution for Kagami and Orishu workers"

[dependencies]
orishu-plugin.workspace = true
orishu-workload.workspace = true
serde.workspace = true
thiserror.workspace = true
# Pinned engine, matching Rust 1.97. No WASI, async guest ABI, shared memories,
# native guest libraries, on-disk compilation cache or profiling capability.
# See README for the runtime-only dependency and security/update rationale.
wasmtime = { version = "=48.0.2", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "anyhow"] }

[dev-dependencies]
criterion = { workspace = true }
wat = "=1.254.0"
wit-component = "=0.254.0"

[[bench]]
name = "runtime"
harness = false
