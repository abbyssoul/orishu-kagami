[package]
name = "orishu-field-contract-fixture"
version = "0.1.0"
edition = "2024"
publish = false

# An external plugin toolchain fixture, deliberately outside the host workspace.
[workspace]
members = ["dynamics"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc", "std"] }

[profile.release]
panic = "abort"
opt-level = "s"
strip = "debuginfo"
