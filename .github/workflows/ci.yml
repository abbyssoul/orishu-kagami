name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out for a release gate.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and public docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          kagami: "true"
      - run: make fmt-check
      - run: make docs-check
      - run: make lint

  test:
    name: Root build and test contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          kagami: "true"
          kagami-runtime: "true"
      - run: make build
      - run: make test
      - run: make test-docs
      - run: make docs
      - name: Smoke-test Kagami's offscreen renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: make smoke-kagami
      - name: Verify the Orishu systemd unit
        run: |
          root="$RUNNER_TEMP/systemd-root"
          mkdir -p "$root/etc/systemd/system" "$root/usr/bin"
          cp etc/systemd/orishu-worker.service "$root/etc/systemd/system/orishu-worker.service"
          install -m 0755 /bin/true "$root/usr/bin/orishu-worker"
          for unit in sysinit.target basic.target multi-user.target network-online.target; do
            printf '[Unit]\nDescription=%s\n' "$unit" > "$root/etc/systemd/system/$unit"
          done
          systemd-analyze verify --root="$root" /etc/systemd/system/orishu-worker.service

  packaging-contract:
    name: Release packaging contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check release version derivation
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          python3 scripts/release/check-version.py "v$version"

  kagami-platforms:
    name: Kagami (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and test Kagami
        run: cargo test --locked -p kagami -p kagami-renderer --all-targets
